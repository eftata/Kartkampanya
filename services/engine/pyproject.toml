[project]
name = "kartplan-engine"
version = "0.1.0"
description = "KartPlan motoru: CP-SAT optimizasyonu ve kampanya veri hattı"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.1",
    "httpx2>=2.13.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "selectolax>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sırası
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # sadeleştirme
    "S",            # bandit (güvenlik)
    "RUF",
]

# Türkçe yorum ve metinlerdeki noktasız ı, i ile karıştırılabilir karakter sayılmasın.
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert ve test sırları

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
